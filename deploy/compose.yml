# How the site runs on the VPS (spec 013).
#
# Lives at /docker/belso/compose.yml on the box, beside the app.env that T-07
# writes. Postgres is not here — it has its own stack at /docker/belso-db and is
# reached over the shared network, because a database whose lifecycle is tied to
# the application's is a database that goes away when somebody redeploys badly.

services:
  app:
    # Tagged with the commit sha, so `docker ps` answers "what is actually
    # running" and a rollback is one edit to `BELSO_TAG` in app.env rather than
    # an archaeology exercise. It lives in app.env because that file is the
    # record of what this box is meant to be running — passing it on the command
    # line means the record is whatever the last person typed.
    #
    # **`:?` and not `:-latest`.** The default was there for one deploy and cost
    # exactly what it was meant to prevent: a `compose up` run without the
    # variable quietly re-tagged the running container `belso:latest`, and
    # `docker ps` stopped being able to say which commit was serving. A silent
    # fallback to a moving tag is worse than a stopped deploy, so this one
    # refuses to start.
    image: belso:${BELSO_TAG:?set BELSO_TAG in app.env to the commit sha to run}
    container_name: belso-app
    restart: unless-stopped

    # Written by T-07, chmod 600, root-owned, never in the repository. Carries
    # DATABASE_URL, DATABASE_EDITOR_URL, THROTTLE_SECRET, MEDIA_ROOT.
    env_file: app.env

    volumes:
      # **The client's photographs, and the only data on this box that Postgres
      # does not hold.** `belso-backup.sh` dumps the database and does not touch
      # the filesystem, so until T-18 extends it this volume is the single copy
      # of every photograph she has uploaded.
      #
      # Named, not a bind mount: a bind mount to a host path works equally well
      # until somebody moves the compose file, at which point a relative path
      # silently points somewhere new and the gallery empties. A named volume is
      # owned by Docker and survives `down`, `up`, a new image and a rebuilt
      # container.
      #
      # **And external, so it survives `down -v` too.** It was compose-managed
      # until the first deploy, where compose warned that the volume already
      # existed and it had not created it — true, `ops:check-media` made it. The
      # warning was the useful half: a volume compose owns is a volume
      # `down -v` deletes, and one mistyped flag would take every photograph the
      # client has uploaded with no backup behind it until T-18. Declaring it
      # external costs one `docker volume create belso-media` on a new box, which
      # the runbook carries, and makes the destructive flag a no-op here.
      - belso-media:/app/media

    networks:
      # Postgres lives here. Created by the belso-db stack, so it is external:
      # if this file declared it, `docker compose down` on the app could take
      # the database's network with it.
      - belso-net

    labels:
      - traefik.enable=true
      # **`${BELSO_DOMAIN}` needs `--env-file app.env` on the compose command,
      # not just the `env_file:` above.** They are different mechanisms and it is
      # an easy hour to lose: `env_file:` puts variables inside the container,
      # while `${...}` here is interpolated by compose itself, which reads only
      # the shell and `.env`. Without the flag this label becomes
      # ``Host(``)`` — compose warns, Traefik registers a router that matches
      # nothing, and the site answers 404 while every container is healthy.
      # Until B-2 provides a real domain the value is the VPS hostname, which is
      # what T-08 deploys against.
      - traefik.http.routers.belso.rule=Host(`${BELSO_DOMAIN}`)
      - traefik.http.routers.belso.entrypoints=websecure
      - traefik.http.routers.belso.tls.certresolver=letsencrypt
      # Traefik runs on the host network, so it needs the container's port
      # explicitly — it cannot infer it from a bridge it is not on. This is the
      # line T-06 exists to prove, because getting it wrong produces a 404 from
      # Traefik rather than an error from anything.
      - traefik.http.services.belso.loadbalancer.server.port=3000

      # **The whole site sits behind a password until it is allowed to be
      # public** (T-08b, `scripts/vps/belso-gate.sh`). T-08 deployed on the
      # understanding that the VPS hostname is "not public"; it is not, because
      # Traefik's certificate publishes that hostname to the Certificate
      # Transparency logs, which are scraped. B-9 forbids a reachable contact
      # form before the privacy notice exists, and the notice is still headings
      # reading "Section à rédiger."
      #
      # One middleware over the router, so it covers the storefront, the enquiry
      # form and the back-office together, crawlers included.
      #
      # **Deleting these two lines is the launch step (T-16).** It is a reviewed
      # diff rather than a runtime flag on purpose: a site going public should
      # not be one argument away, and an empty `basicauth.users` is a broken
      # middleware rather than an open door, so a flag would fail unreadably.
      # `:?` here, and the priority was inverted until a review said so. The tag
      # above — cosmetic, a matter of knowing which commit is serving — was
      # required, while the only thing keeping the client's catalogue and a
      # working contact form off the public internet was left to default. An
      # empty value produces a compose *warning* and an empty `users` list, and
      # the gate then holds only because Traefik's parser rejects it. Fail on our
      # own terms, not a third party's.
      - traefik.http.routers.belso.middlewares=belso-gate@docker
      - traefik.http.middlewares.belso-gate.basicauth.users=${BELSO_BASIC_AUTH:?run scripts/vps/belso-gate.sh — the pre-launch gate must be set}
      # Traefik forwards the Authorization header to the application by default,
      # so the gate's plaintext credential would reach the Next.js process on
      # every request and into any error path that dumps headers.
      - traefik.http.middlewares.belso-gate.basicauth.removeheader=true

    # The image declares its own HEALTHCHECK against /robots.txt. Repeated here
    # only to give the deploy something to wait on before it calls itself done.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  belso-media:
    name: belso-media
    # Created once, by hand or by `ops:check-media`, and never by compose. See
    # the note on the mount above: this is what keeps `down -v` from being able
    # to destroy the photographs.
    external: true

networks:
  belso-net:
    external: true
